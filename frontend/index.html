<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Knowledge Assistant</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, textarea {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  button {
    width: 100%;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    color: var(--error);
    font-size: 0.8rem;
    margin: -8px 0 16px;
    display: none;
  }
  .respuesta {
    margin-top: 20px;
    padding: 16px;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.5;
    white-space: pre-wrap;
    display: none;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: auto;
    padding: 6px 12px;
    font-size: 0.75rem;
  }
  .logout:hover { background: var(--border); color: var(--text); }
  #queryScreen { display: none; }
</style>
</head>
<body>

<div class="card" id="loginScreen">
  <h1>RAG Knowledge Assistant</h1>
  <p class="subtitle">Inicia sesión para consultar tus documentos</p>

  <label for="username">Usuario</label>
  <input type="text" id="username" autocomplete="username" />

  <label for="password">Contraseña</label>
  <input type="password" id="password" autocomplete="current-password" />

  <p class="error" id="loginError"></p>

  <button id="loginBtn" onclick="login()">Iniciar sesión</button>
</div>

<div class="card" id="queryScreen">
  <div class="top-bar">
    <div>
      <h1>RAG Knowledge Assistant</h1>
      <p class="subtitle" style="margin:0" id="userLabel"></p>
    </div>
    <button class="logout" onclick="logout()">Cerrar sesión</button>
  </div>

  <label for="query">Tu pregunta</label>
  <textarea id="query" placeholder="¿Qué hago si se me poncha una rueda?"></textarea>

  <p class="error" id="queryError"></p>

  <button id="queryBtn" onclick="ask()">Preguntar</button>

  <div class="respuesta" id="respuesta"></div>
</div>

<script>
  // --- Configuración: ajusta estos valores a tu despliegue ---
  const COGNITO_REGION = "us-east-1";
  const COGNITO_CLIENT_ID = "7sielp0q4qagr0odc0qv990g6a";
  const API_URL = "https://h8qv9dut02.execute-api.us-east-1.amazonaws.com/query";
  // -------------------------------------------------------------

  let idToken = null;

  function showError(elId, msg) {
    const el = document.getElementById(elId);
    el.textContent = msg;
    el.style.display = "block";
  }

  function hideError(elId) {
    document.getElementById(elId).style.display = "none";
  }

  async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    hideError("loginError");

    if (!username || !password) {
      showError("loginError", "Ingresa usuario y contraseña.");
      return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    try {
      const resp = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: COGNITO_CLIENT_ID,
          AuthParameters: { USERNAME: username, PASSWORD: password },
        }),
      });

      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.message || "No se pudo iniciar sesión.");
      }

      idToken = data.AuthenticationResult.IdToken;
      document.getElementById("userLabel").textContent = `Sesión: ${username}`;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("queryScreen").style.display = "block";
    } catch (err) {
      showError("loginError", err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Iniciar sesión";
    }
  }

  function logout() {
    idToken = null;
    document.getElementById("password").value = "";
    document.getElementById("respuesta").style.display = "none";
    document.getElementById("query").value = "";
    document.getElementById("queryScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
  }

  async function ask() {
    const query = document.getElementById("query").value.trim();
    hideError("queryError");

    if (!query) {
      showError("queryError", "Escribe una pregunta.");
      return;
    }

    const btn = document.getElementById("queryBtn");
    btn.disabled = true;
    btn.textContent = "Buscando...";
    document.getElementById("respuesta").style.display = "none";

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": idToken,
        },
        body: JSON.stringify({ query }),
      });

      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || "Error al consultar.");
      }

      const el = document.getElementById("respuesta");
      el.textContent = data.respuesta;
      el.style.display = "block";
    } catch (err) {
      showError("queryError", err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Preguntar";
    }
  }
</script>

</body>
</html>
